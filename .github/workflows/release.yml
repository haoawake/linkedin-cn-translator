name: Release LinkLingo

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/release-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and validate universal Chrome extension
        run: |
          set -euo pipefail
          bash tools/package.sh
          unzip -t dist/LinkLingo.zip
          unzip -p dist/LinkLingo.zip LinkLingo/manifest.json | python3 -m json.tool >/dev/null
          # Chrome extensions are platform-independent. Keep OS-specific download
          # names so the Toolbox detects both Windows and macOS correctly.
          cp dist/LinkLingo.zip dist/LinkLingo-win-universal.zip
          cp dist/LinkLingo.zip dist/LinkLingo-mac-universal.zip
          rm dist/LinkLingo.zip
          (cd dist && sha256sum LinkLingo-*.zip > SHA256SUMS.txt)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkLingo
          path: |
            dist/LinkLingo-win-universal.zip
            dist/LinkLingo-mac-universal.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(cat .github/release-request.txt | tr -d '[:space:]')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/LinkLingo-*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/LinkLingo-*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "LinkLingo $tag" \
              --notes "Chrome extension for LinkedIn profile translation. Windows and macOS ZIP files contain the same cross-platform Chrome extension. Extract and load the LinkLingo directory via chrome://extensions (Developer mode)."
          fi
